    <style>
        :root {
            --brand-deep-navy: #1a365d;
            --brand-electric-blue: #3182ce;
            --brand-orange: #ed8936;
            --brand-dark-gray: #2d3748;
            --brand-light-gray-bg: #f7fafc;
            --brand-white-bg: #ffffff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--brand-light-gray-bg);
            color: var(--brand-dark-gray);
            overscroll-behavior-y: contain;
        }

        .impact-font {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            color: var(--brand-deep-navy);
        }

        .btn-primary {
            background-color: var(--brand-orange);
            font-family: Verdana, sans-serif;
            font-weight: bold;
            transition: background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary:hover {
            background-color: #c05621;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--brand-electric-blue);
            font-family: Verdana, sans-serif;
            font-weight: bold;
            transition: background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-secondary:hover {
            background-color: #2c5aa0;
        }

        .btn-secondary:active {
            transform: scale(0.98);
        }

        .link-style {
            color: var(--brand-electric-blue);
        }

        #sharedContent {
            word-break: break-word;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--brand-electric-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--brand-deep-navy);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            max-width: calc(100% - 40px);
        }

        .install-banner button {
            background: white;
            color: var(--brand-deep-navy);
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* iOS Safari specific styles */
        @supports (-webkit-touch-callout: none) {
            body {
                height: 100vh;
                overflow: hidden;
            }

            #app {
                height: 100vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
        }

        /* OPTIONAL: VISUAL FEEDBACK STYLES */
        .ring-2 {
            box-shadow: 0 0 0 2px currentColor;
            transition: box-shadow 0.3s ease;
        }

        .ring-blue-400 {
            color: #60a5fa; /* Tailwind blue-400 */
        }

        .ring-green-400 {
            color: #4ade80; /* Tailwind green-400 */
        }

        #textInput, #imageInputContainer /* Assuming imageInput is wrapped or styled directly */ {
            transition: border-color 0.3s ease;
        }
        /* If #imageInput is the file input itself, styling its border might be tricky.
           Often a container around it is styled, or specific ::file-selector-button pseudo-element.
           For simplicity, if #imageInput is a direct target for border, it's included.
           The provided JS targets imageInput.style.borderColor.
        */
        #imageInput {
            transition: border-color 0.3s ease; /* Added as per JS */
        }


        /* Auto-sync indicator (Example style, can be refined) */
        .auto-sync-active { /* This class needs to be added to a relevant element via JS if used */
            position: relative;
        }

        .auto-sync-active::after {
            content: "Auto-sync enabled";
            position: absolute;
            top: -20px; /* Adjust as needed */
            right: 0;
            font-size: 11px;
            color: #48bb78; /* Tailwind green-500 */
            font-weight: 500;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Install Banner -->
    <div id="installBanner" class="install-banner">
        <span>📱 Install The Bridge app</span>
        <button onclick="installPWA()">Install</button>
        <button onclick="dismissInstallBanner()">Not now</button>
    </div>

    <div id="app" class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-2xl p-8 space-y-6">

        <!-- Login View -->
        <div id="loginView">
            <h1 class="impact-font text-4xl text-center">The Bridge</h1>
            <p class="text-center text-gray-600 mt-2">Your universal clipboard.</p>
            <div class="mt-8 space-y-4">
                <div>
                    <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
                    <input type="text" id="firstName" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="e.g., Loki">
                </div>
                <div>
                    <label for="passcode" class="block text-sm font-medium text-gray-700">Passcode</label>
                    <input type="text" id="passcode" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Enter a code or generate one">
                </div>
                <div class="flex items-center justify-between space-x-4">
                    <button id="generateCode" class="w-full btn-secondary text-white py-2 px-4 rounded-md">Generate Code</button>
                    <button id="connect" class="w-full btn-primary text-white py-2 px-4 rounded-md">Connect</button>
                </div>
                <p id="loginError" class="text-red-500 text-sm text-center"></p>
            </div>
        </div>

        <!-- Main App View -->
        <div id="mainView" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h1 class="impact-font text-2xl">The Bridge</h1>
                <button id="disconnect" class="text-sm link-style hover:underline">Disconnect</button>
            </div>
            <p class="text-center bg-gray-100 p-2 rounded-md text-sm">Connected as: <strong id="connectionId" class="font-mono"></strong></p>

            <div class="mt-6 space-y-4">
                <!-- Text Input -->
                <div>
                    <textarea id="textInput" rows="4" class="w-full p-3 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="Paste text here to share..."></textarea>
                    <button id="sendText" class="w-full mt-2 btn-primary text-white py-2 px-4 rounded-md">Send Text</button>
                </div>

                <!-- Image Input -->
                <div>
                    <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                    <button id="sendImage" class="w-full mt-2 btn-primary text-white py-2 px-4 rounded-md">Send Image</button>
                </div>
            </div>

            <!-- Shared Content Display -->
            <div class="mt-8">
                <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">Live Clipboard</h2>
                <div id="sharedContent" class="mt-4 p-4 bg-gray-50 rounded-md min-h-[100px] flex items-center justify-center text-gray-500">
                    Waiting for content...
                </div>
                <div id="loader" class="hidden loader mx-auto my-4"></div>
            </div>
        </div>

    </div>

    <!-- Service Worker Registration -->
    <script>
        // PWA Installation
        let deferredPrompt;
        const installBanner = document.getElementById('installBanner');

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            // Create inline service worker
            const swContent = `
                const CACHE_NAME = 'the-bridge-v1';
                const urlsToCache = [
                    '/',
                    'https://cdn.tailwindcss.com',
                    'https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap',
                    'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js',
                    'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js',
                    'https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js'
                ];

                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME)
                            .then(cache => cache.addAll(urlsToCache))
                    );
                });

                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request)
                            .then(response => response || fetch(event.request))
                    );
                });
            `;

            const blob = new Blob([swContent], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);

            navigator.serviceWorker.register(swUrl)
                .then(registration => console.log('SW registered'))
                .catch(err => console.log('SW registration failed'));
        }

        // PWA Install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;

            // Show install banner after 5 seconds
            setTimeout(() => {
                if (!localStorage.getItem('installDismissed')) {
                    installBanner.style.display = 'flex';
                }
            }, 5000);
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                    installBanner.style.display = 'none';
                });
            }
        }

        function dismissInstallBanner() {
            installBanner.style.display = 'none';
            localStorage.setItem('installDismissed', 'true');
        }

        // iOS Safari install prompt
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isInStandaloneMode = window.matchMedia('(display-mode: standalone)').matches;

        if (isIOS && !isInStandaloneMode) {
            setTimeout(() => {
                if (!localStorage.getItem('iosInstallDismissed')) {
                    alert('To install The Bridge on iOS: Tap the share button and select "Add to Home Screen"');
                    localStorage.setItem('iosInstallDismissed', 'true');
                }
            }, 10000);
        }
    </script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // IMPORTANT: Replace with your own Firebase project configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // UI Elements
        const loginView = document.getElementById('loginView');
        const mainView = document.getElementById('mainView');
        const firstNameInput = document.getElementById('firstName');
        const passcodeInput = document.getElementById('passcode');
        const generateCodeBtn = document.getElementById('generateCode');
        const connectBtn = document.getElementById('connect');
        const disconnectBtn = document.getElementById('disconnect');
        const connectionIdDisplay = document.getElementById('connectionId');
        const textInput = document.getElementById('textInput');
        const sendTextBtn = document.getElementById('sendText');
        const imageInput = document.getElementById('imageInput');
        const sendImageBtn = document.getElementById('sendImage');
        const sharedContent = document.getElementById('sharedContent');
        const loginError = document.getElementById('loginError');
        const loader = document.getElementById('loader');

        let currentConnectionId = null;
        let unsubscribe = null;

        // Configuration for auto-sync
        const AUTO_SYNC_DELAY = 500; // Milliseconds to wait after user stops typing
        let textSyncTimeout = null;
        let lastSyncedText = '';
        let lastSyncedImage = '';

        // Get or create a unique device ID
        function getDeviceId() {
            let deviceId = sessionStorage.getItem('bridgeDeviceId');
            if (!deviceId) {
                deviceId = `device-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                sessionStorage.setItem('bridgeDeviceId', deviceId);
            }
            return deviceId;
        }

        // Event Listeners
        generateCodeBtn.addEventListener('click', () => {
            passcodeInput.value = Math.floor(100000 + Math.random() * 900000);
        });

        connectBtn.addEventListener('click', () => {
            const firstName = firstNameInput.value.trim().toLowerCase();
            const passcode = passcodeInput.value.trim();

            if (!firstName || !passcode) {
                loginError.textContent = "Please enter both name and passcode.";
                return;
            }
            loginError.textContent = "";
            currentConnectionId = `${firstName}-${passcode}`;

            loginView.classList.add('hidden');
            mainView.classList.remove('hidden');
            connectionIdDisplay.textContent = currentConnectionId;

            listenToBridge();

            // Enable auto-sync listeners after connection
            enableAutoSync();
        });

        disconnectBtn.addEventListener('click', () => {
            if (unsubscribe) {
                unsubscribe();
            }
            currentConnectionId = null;
            mainView.classList.add('hidden');
            loginView.classList.remove('hidden');
            firstNameInput.value = '';
            passcodeInput.value = '';
            sharedContent.innerHTML = 'Waiting for content...';

            // Disable auto-sync listeners
            disableAutoSync();
        });

        // Manual Send Text Button (keep for explicit sending)
        sendTextBtn.addEventListener('click', async () => {
            await syncText();
        });

        // Manual Send Image Button (keep for explicit sending)
        sendImageBtn.addEventListener('click', async () => {
            await syncImage();
        });

        // ===========================================
        // NEW AUTO-SYNC FUNCTIONS
        // ===========================================

        // Function to sync text to Firebase
        async function syncText() {
            const text = textInput.value;
            if (text && currentConnectionId && text !== lastSyncedText) {
                try {
                    const bridgeRef = doc(db, 'bridges', currentConnectionId);
                    await setDoc(bridgeRef, {
                        type: 'text',
                        content: text,
                        timestamp: new Date(),
                        deviceId: getDeviceId() // Add device ID to prevent echo
                    }, { merge: true });
                    lastSyncedText = text;

                    // Visual feedback - briefly change border color
                    textInput.style.borderColor = '#48bb78';
                    setTimeout(() => {
                        textInput.style.borderColor = '#e2e8f0';
                    }, 300);
                } catch (error) {
                    console.error("Error syncing text: ", error);
                }
            }
        }

        // Function to sync image to Firebase
        async function syncImage() {
            const file = imageInput.files[0];
            if (file && currentConnectionId) {
                // Check if this is a new image
                const fileIdentifier = `${file.name}-${file.size}-${file.lastModified}`;
                if (fileIdentifier === lastSyncedImage) return;

                loader.classList.remove('hidden');
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const dataUrl = reader.result;
                    const storageRef = ref(storage, `bridges/${currentConnectionId}/${Date.now()}-${file.name}`);
                    try {
                        await uploadString(storageRef, dataUrl, 'data_url');
                        const downloadURL = await getDownloadURL(storageRef);

                        const bridgeRef = doc(db, 'bridges', currentConnectionId);
                        await setDoc(bridgeRef, {
                            type: 'image',
                            content: downloadURL,
                            timestamp: new Date(),
                            deviceId: getDeviceId()
                        }, { merge: true });

                        lastSyncedImage = fileIdentifier;

                        // Visual feedback
                        imageInput.style.borderColor = '#48bb78';
                        setTimeout(() => {
                            imageInput.style.borderColor = '#e2e8f0';
                        }, 300);
                    } catch (error) {
                        console.error("Error uploading image: ", error);
                    } finally {
                        loader.classList.add('hidden');
                    }
                };
            }
        }

        // Enable auto-sync event listeners
        function enableAutoSync() {
            // Auto-sync on text input (typing)
            textInput.addEventListener('input', handleTextInput);

            // Auto-sync on paste
            textInput.addEventListener('paste', handleTextPaste);

            // Auto-sync on image selection
            imageInput.addEventListener('change', handleImageChange);

            // Auto-sync on Enter key (for quick send)
            textInput.addEventListener('keypress', handleEnterKey);
        }

        // Disable auto-sync event listeners
        function disableAutoSync() {
            textInput.removeEventListener('input', handleTextInput);
            textInput.removeEventListener('paste', handleTextPaste);
            imageInput.removeEventListener('change', handleImageChange);
            textInput.removeEventListener('keypress', handleEnterKey);
        }

        // Handle text input with debouncing
        function handleTextInput(e) {
            // Clear existing timeout
            clearTimeout(textSyncTimeout);

            // Set new timeout for auto-sync
            textSyncTimeout = setTimeout(() => {
                syncText();
            }, AUTO_SYNC_DELAY);
        }

        // Handle paste event for immediate sync
        function handleTextPaste(e) {
            // Small delay to ensure pasted content is in the textarea
            setTimeout(() => {
                syncText();
            }, 100);
        }

        // Handle image selection for auto-upload
        function handleImageChange(e) {
            if (e.target.files && e.target.files[0]) {
                syncImage();
            }
        }

        // Handle Enter key for immediate sync (Shift+Enter for new line)
        function handleEnterKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                syncText();
                // Optional: Clear the text field after sending
                // textInput.value = '';
                // lastSyncedText = '';
            }
        }

        // Firestore Listener
        function listenToBridge() {
            if (currentConnectionId) {
                const bridgeRef = doc(db, 'bridges', currentConnectionId);
                const myDeviceId = getDeviceId();

                unsubscribe = onSnapshot(bridgeRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        loader.classList.add('hidden');

                        // Only update if the content is from another device
                        if (data.deviceId && data.deviceId !== myDeviceId) {
                            if (data.type === 'text') {
                                sharedContent.innerHTML = `
                                    <div class="w-full">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="text-xs text-gray-500">Received text:</span>
                                            <button onclick="copyToClipboard('${data.content.replace(/'/g, "\\'")}')"
                                                    class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200">
                                                Copy
                                            </button>
                                        </div>
                                        <p class="text-left bg-white p-3 rounded border">${data.content}</p>
                                    </div>
                                `;

                                // Show notification effect
                                sharedContent.classList.add('ring-2', 'ring-blue-400');
                                setTimeout(() => {
                                    sharedContent.classList.remove('ring-2', 'ring-blue-400');
                                }, 1000);
                            } else if (data.type === 'image') {
                                sharedContent.innerHTML = `
                                    <div class="w-full">
                                        <span class="text-xs text-gray-500 block mb-2">Received image:</span>
                                        <img src="${data.content}" alt="Shared Image" class="max-w-full max-h-64 rounded-md object-contain mx-auto">
                                    </div>
                                `;

                                // Show notification effect
                                sharedContent.classList.add('ring-2', 'ring-green-400');
                                setTimeout(() => {
                                    sharedContent.classList.remove('ring-2', 'ring-green-400');
                                }, 1000);
                            }
                        }
                    } else {
                        sharedContent.innerHTML = 'Waiting for content...';
                        setDoc(doc(db, 'bridges', currentConnectionId), {
                            type: 'init',
                            content: 'channel created',
                            timestamp: new Date(),
                            deviceId: myDeviceId
                        });
                    }
                }, (error) => {
                    console.error("Error listening to bridge: ", error);
                    alert("Connection error. Check console for details.");
                });
            }
        }

        // ===========================================
        // UTILITY FUNCTIONS
        // Add these to the global scope in your HTML
        // ===========================================

        // Copy to clipboard function (add to global scope)
        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Visual feedback
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                btn.classList.add('bg-green-100', 'text-green-700');
                btn.classList.remove('bg-blue-100', 'text-blue-700');

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('bg-green-100', 'text-green-700');
                    btn.classList.add('bg-blue-100', 'text-blue-700');
                }, 1500);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
